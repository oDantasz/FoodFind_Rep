name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: npm test (Node 20)
    runs-on: ubuntu-latest
    # PostgreSQL só para a suíte de persistência externa (DATABASE_URL).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: foodfind
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FOODFIND_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/foodfind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    name: docker build + healthcheck
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem
        run: docker build -t foodfind:ci .
      - name: Subir e aguardar o healthcheck
        run: |
          docker run -d --name foodfind-ci -p 3000:3000 foodfind:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' foodfind-ci)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          docker logs foodfind-ci
          exit 1
